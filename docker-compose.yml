services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: foodhub
      POSTGRES_USER: foodhub
      POSTGRES_PASSWORD: foodhub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodhub"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides .env so the web container always talks to the `db`
      # service by its Docker network name, regardless of what's in .env.
      DATABASE_URL: postgres://foodhub:foodhub@db:5432/foodhub
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media

volumes:
  postgres_data:
  media_data:
