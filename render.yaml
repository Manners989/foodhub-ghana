# Render.com deployment blueprint.
# Push this repo to GitHub, then in Render: New -> Blueprint -> pick the repo.
# Render reads this file and provisions both services automatically.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: foodhub-ghana
    runtime: docker
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: foodhub-db
          property: connectionString
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false

databases:
  - name: foodhub-db
    plan: free
